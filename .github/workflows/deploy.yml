name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the live site
        run: |
          if ! grep -q '^\[\[routes\]\]' wrangler.toml; then
            echo "Routes are not switched on yet."
            echo "Open the workers.dev URL printed in the Deploy step and add /galaxeye to the end."
            exit 0
          fi
          sleep 15
          FAIL=0
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" $3 "$1")
            if [ "$code" = "$2" ]; then echo "OK    $1 returned $code"; else echo "FAIL  $1 returned $code, expected $2"; FAIL=1; fi
          }
          check https://rohitrao.in/galaxeye 200
          check https://rohitrao.in/galaxeye/ 200
          check https://rohitrao.in/galaxeye/anything 404
          # Other tools may redirect (for example /parts to /parts/), so follow redirects for these
          check https://rohitrao.in/ 200 -L
          check https://rohitrao.in/upstream 200 -L
          check https://rohitrao.in/parts 200 -L
          echo
          echo "Headers on /galaxeye:"
          curl -sI https://rohitrao.in/galaxeye | grep -iE "^(HTTP|content-type|x-robots-tag|cache-control)"
          if [ "$FAIL" = "1" ]; then
            echo
            echo "Something is wrong. If the root, /upstream or /parts failed, delete the galaxeye routes in Cloudflare under Workers Routes."
          fi
          exit $FAIL
